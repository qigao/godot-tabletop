name: Godot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Godot 4.6 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: Godot_v4.6-stable_linux.x86_64.zip
            binary: Godot_v4.6-stable_linux.x86_64
            sha256: 6bcc59dfd1d670e918c77eae06e82b9dc5699de13d353dc3a4b3b6b307b6dc06
          - os: windows-latest
            archive: Godot_v4.6-stable_win64.exe.zip
            binary: Godot_v4.6-stable_win64_console.exe
            sha256: 5c9177625c0dca18c92ba6328203c7b5a9596c85ef9d7c968396f0272d8f10d9
          - os: macos-latest
            archive: Godot_v4.6-stable_macos.universal.zip
            binary: Godot.app/Contents/MacOS/Godot
            sha256: fc15ceb6280420f117ab4ef62332654db0088078faeeb9025dd814276185ed3b
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot (standard GDScript build)
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: curl --fail --location --output "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/$ARCHIVE"
      - name: Verify and extract
        env:
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          GODOT_BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, zipfile
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'godot.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit('Godot archive checksum mismatch')
          with zipfile.ZipFile(archive) as source:
              source.extractall(root / 'godot')
          (root / 'godot' / os.environ['GODOT_BINARY']).chmod(0o755)
          PY
      - name: Import, rules, replay, and real addon scene
        run: python scripts/check.py "$RUNNER_TEMP/godot/${{ matrix.binary }}"
      - name: Package and accept runnable client
        run: python scripts/package_client.py "$RUNNER_TEMP/godot/${{ matrix.binary }}" "$RUNNER_TEMP/godot" "${{ runner.os }}" "exports/Tabletop-${{ runner.os }}.zip"
      - name: Upload local client bundle
        uses: actions/upload-artifact@v4
        with:
          name: Tabletop-${{ runner.os }}
          path: exports/Tabletop-${{ runner.os }}.zip
      - name: Render actual client layouts
        if: runner.os == 'Linux'
        run: python scripts/render_client.py "$RUNNER_TEMP/godot/${{ matrix.binary }}"
      - name: Upload rendered client layouts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Client-layouts
          path: docs/images/*.png
