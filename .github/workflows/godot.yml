name: Godot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Godot 4.6 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: Godot_v4.6-stable_linux.x86_64.zip
            binary: Godot_v4.6-stable_linux.x86_64
            sha256: 6bcc59dfd1d670e918c77eae06e82b9dc5699de13d353dc3a4b3b6b307b6dc06
          - os: windows-latest
            archive: Godot_v4.6-stable_win64.exe.zip
            binary: Godot_v4.6-stable_win64_console.exe
            sha256: 5c9177625c0dca18c92ba6328203c7b5a9596c85ef9d7c968396f0272d8f10d9
          - os: macos-latest
            archive: Godot_v4.6-stable_macos.universal.zip
            binary: Godot.app/Contents/MacOS/Godot
            sha256: fc15ceb6280420f117ab4ef62332654db0088078faeeb9025dd814276185ed3b
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot (standard GDScript build)
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: curl --fail --location --output "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/$ARCHIVE"
      - name: Verify and extract
        env:
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          GODOT_BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, zipfile
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'godot.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit('Godot archive checksum mismatch')
          with zipfile.ZipFile(archive) as source:
              source.extractall(root / 'godot')
          (root / 'godot' / os.environ['GODOT_BINARY']).chmod(0o755)
          PY
      - name: Import, rules, replay, and real addon scene
        run: python scripts/check.py "$RUNNER_TEMP/godot/${{ matrix.binary }}"
      - name: Cache Windows release template
        if: runner.os == 'Windows'
        id: windows-template
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/windows_release_x86_64.exe
          key: godot-4.6-stable-windows-release-f9cb815a32a1
      - name: Prepare verified Godot Windows release template
        if: runner.os == 'Windows'
        env:
          TEMPLATE_CACHED: ${{ steps.windows-template.outputs.cache-hit }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil, subprocess, zipfile
          root = Path(os.environ['RUNNER_TEMP'])
          template = root / 'windows_release_x86_64.exe'
          if os.environ['TEMPLATE_CACHED'] != 'true':
              archive = root / 'godot-templates.tpz'
              subprocess.run([
                  'curl', '--fail', '--location', '--silent', '--show-error', '--output', str(archive),
                  'https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz',
              ], check=True)
              with archive.open('rb') as downloaded:
                  if hashlib.file_digest(downloaded, 'sha256').hexdigest() != '3b30ac8c1772f25f5dfa5f65922cab0a90e7b960176891237c5772515ebccc46':
                      raise SystemExit('Godot template archive checksum mismatch')
              with zipfile.ZipFile(archive) as pack, pack.open('templates/' + template.name) as source, template.open('wb') as target:
                  shutil.copyfileobj(source, target)
          with template.open('rb') as source:
              if hashlib.file_digest(source, 'sha256').hexdigest() != 'f9cb815a32a1ae3a73ad8699ed2b068cb76fe01636d7e8538243056fac05f37b':
                  raise SystemExit('Godot Windows release template checksum mismatch')
          destination = Path(os.environ['APPDATA']) / 'Godot/export_templates/4.6.stable'
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(template, destination / template.name)
          PY
      - name: Package and accept runnable client
        run: python scripts/package_client.py "$RUNNER_TEMP/godot/${{ matrix.binary }}" "$RUNNER_TEMP/godot" "${{ runner.os }}" "exports/Tabletop-${{ runner.os }}.zip"
      - name: Upload local client bundle
        uses: actions/upload-artifact@v4
        with:
          name: Tabletop-${{ runner.os }}
          path: exports/Tabletop-${{ runner.os }}.zip
      - name: Download and verify recording encoder
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/ffmpeg.gz" "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz"
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib, os
          root = Path(os.environ['RUNNER_TEMP'])
          archive = (root / 'ffmpeg.gz').read_bytes()
          if hashlib.sha256(archive).hexdigest() != 'bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa':
              raise SystemExit('Recording encoder checksum mismatch')
          binary = root / 'ffmpeg'
          binary.write_bytes(gzip.decompress(archive))
          binary.chmod(0o755)
          PY
      - name: Render actual client layouts
        if: runner.os == 'Linux'
        run: python scripts/render_client.py "$RUNNER_TEMP/godot/${{ matrix.binary }}" "$RUNNER_TEMP/ffmpeg"
      - name: Upload rendered client layouts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Client-layouts
          path: |
            docs/images/*.png
            docs/images/*.gif
